<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
  :root {
    --bg: #11151b;
    --surface: #171c24;
    --surface-in: #0d1117;
    --border: #262e3a;
    --text: #e7ebf0;
    --muted: #7c8696;
    --accent: #f2a93b;
    --accent-dim: #8a6a2d;
    --good: #3ddc84;
    --bad: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 320px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 18px 14px;
    border-bottom: 1px solid var(--border);
  }
  .header svg { flex-shrink: 0; }
  .header h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.01em; }
  .header p { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .status {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 14px 18px 0;
    padding: 9px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .status-text { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status.on .status-text { color: var(--text); }

  .signal .bar { stroke: var(--border); transition: stroke 0.2s; }
  .signal .dot { fill: var(--border); transition: fill 0.2s; }
  .signal.on .bar1 { stroke: var(--accent); }
  .signal.on .bar2 { stroke: var(--accent); animation: lightup 1.8s ease-in-out 0.15s infinite; }
  .signal.on .bar3 { stroke: var(--accent); animation: lightup 1.8s ease-in-out 0.3s infinite; }
  .signal.on .dot  { fill: var(--good); }
  @keyframes lightup { 0%, 60%, 100% { opacity: 1; } 30% { opacity: 0.35; } }

  .body { padding: 14px 18px 18px; }

  .section-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    margin: 14px 0 7px;
  }
  .section-label:first-child { margin-top: 0; }
  .add-toggle {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    padding: 0;
  }
  .add-toggle:hover { color: #ffb94f; }

  /* Account list */
  .accounts {
    max-height: 168px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
  }
  .accounts.empty { display: none; }
  .account-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
  }
  .account-row:last-child { border-bottom: none; }
  .account-row:hover { background: rgba(255,255,255,0.025); }

  .avatar {
    width: 26px; height: 26px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700;
    background: var(--surface-in);
    color: var(--muted);
    border: 1px solid var(--border);
    flex-shrink: 0;
    text-transform: uppercase;
  }
  .account-row.active .avatar {
    background: rgba(242, 169, 59, 0.12);
    color: var(--accent);
    border-color: var(--accent-dim);
  }

  .acc-info { flex: 1; min-width: 0; }
  .acc-user {
    font-size: 12px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .acc-sub { font-size: 10px; color: var(--muted); margin-top: 1px; }
  .account-row.active .acc-sub { color: var(--good); }

  .acc-delete {
    background: none; border: none;
    color: var(--muted);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    padding: 4px;
    flex-shrink: 0;
    border-radius: 4px;
  }
  .acc-delete:hover { color: var(--bad); background: rgba(255,107,107,0.08); }

  .no-accounts {
    padding: 14px 10px;
    text-align: center;
    font-size: 11px;
    color: var(--muted);
  }

  /* Add account form */
  .add-form { display: none; margin-top: 10px; }
  .add-form.open { display: block; }
  label {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .field { margin-bottom: 10px; }
  input {
    width: 100%;
    padding: 9px 10px;
    background: var(--surface-in);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    font-size: 12.5px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    outline: none;
  }
  input::placeholder { color: #4a5262; font-family: -apple-system, sans-serif; }
  input:focus { border-color: var(--accent-dim); }

  .btn-row { display: flex; gap: 8px; margin-top: 2px; }
  button.action {
    flex: 1;
    padding: 9px;
    border-radius: 5px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .save { background: var(--accent); color: #1a1205; }
  .save:hover { background: #ffb94f; }
  .cancel { background: transparent; color: var(--muted); border-color: var(--border); }
  .cancel:hover { color: var(--text); border-color: #3a4454; }

  .msg {
    margin-top: 10px;
    padding: 8px 10px;
    border-radius: 5px;
    font-size: 11px;
    display: none;
  }
  .msg.ok  { display: block; background: rgba(61, 220, 132, 0.08); border: 1px solid rgba(61, 220, 132, 0.3); color: var(--good); }
  .msg.err { display: block; background: rgba(255, 107, 107, 0.08); border: 1px solid rgba(255, 107, 107, 0.3); color: var(--bad); }

  .footer {
    padding: 10px 18px 14px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 10.5px;
    color: #4a5262;
  }
  .footer a {
    color: #5a6478;
    cursor: pointer;
    text-decoration: none;
  }
  .footer a:hover { color: var(--bad); }
</style>
</head>
<body>

  <div class="header">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <path d="M4 9a13 13 0 0 1 16 0" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
      <path d="M7 13a8.5 8.5 0 0 1 10 0" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="12" cy="18" r="1.6" fill="var(--accent)"/>
    </svg>
    <div>
      <h1>PES Wi-Fi Autologin</h1>
      <p>Re-signs you in the moment the portal logs you out</p>
    </div>
  </div>

  <div class="status off" id="status">
    <svg class="signal off" id="dot" width="20" height="16" viewBox="0 0 20 16" fill="none">
      <path class="bar bar1" d="M2 10a12 12 0 0 1 16 0" stroke-width="2" stroke-linecap="round"/>
      <path class="bar bar2" d="M5 13a7.5 7.5 0 0 1 10 0" stroke-width="2" stroke-linecap="round"/>
      <circle class="dot" cx="10" cy="15" r="1.4"/>
    </svg>
    <span class="status-text" id="statusText">No credentials saved</span>
  </div>

  <div class="body">
    <div class="section-label">
      <span>Saved accounts</span>
      <button class="add-toggle" id="addToggle">+ Add account</button>
    </div>

    <div class="accounts" id="accounts"></div>

    <div class="add-form" id="addForm">
      <div class="field">
        <label for="username">Username / USN</label>
        <input type="text" id="username" placeholder="PES2UG24CSXXX"/>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Your password"/>
      </div>
      <div class="btn-row">
        <button class="action save" id="saveBtn">Save account</button>
        <button class="action cancel" id="cancelBtn">Cancel</button>
      </div>
    </div>

    <div class="msg" id="msg"></div>
  </div>

  <div class="footer">
    <span>Stored locally in this browser only.</span>
    <a id="clearAll">Remove all</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
